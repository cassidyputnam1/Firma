<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#181818">
  <meta name="description" content="Creative practice and selected work.">
  <title>YOUR NAME</title>
  <style>
    :root { --text: #fff; --edge: clamp(18px, 3vw, 48px); }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { font-family: Arial, Helvetica, sans-serif; background: #181818; color: var(--text); }
    .video-background { position: fixed; inset: 0; overflow: hidden; z-index: -2; background: linear-gradient(125deg,#292421,#6c5b53 55%,#302d2c); }
    .video-background video { height: 100%; width: 100%; object-fit: cover; object-position: center; display: block; }
    .shade { position: fixed; inset: 0; background: rgba(0,0,0,.15); z-index: -1; pointer-events: none; }
    .page { display: flex; flex-direction: column; justify-content: space-between; min-height: 100svh; padding: var(--edge); }
    .brand { margin: 0; font-size: clamp(24px, 4.2vw, 66px); line-height: .95; font-weight: 500; letter-spacing: -.055em; text-transform: uppercase; }
    .bottom { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px; font-size: clamp(13px, 1.2vw, 17px); line-height: 1.45; }
    .contact { display: flex; flex-direction: column; align-items: flex-start; }
    a { color: inherit; text-decoration: none; text-underline-offset: .22em; }
    a:hover, a:focus-visible { text-decoration: underline; }
    .side-note { text-align: right; }
    @media(max-width:600px) { .page { padding: 22px; } .brand { font-size: clamp(32px, 9vw, 54px); } .bottom { align-items: flex-start; flex-direction: column; gap: 14px; } .side-note { text-align: left; } }
    @media(prefers-reduced-motion:reduce) { .video-background video { display:none; } }
  </style>
</head>
<body>
  <div class="video-background" aria-hidden="true">
    <!-- Your included background video plays automatically. -->
    <video autoplay muted loop playsinline preload="metadata">
      <source src="background.mp4" type="video/mp4">
    </video>
  </div>
  <div class="shade" aria-hidden="true"></div>
  <main class="page">
    <!-- CHANGE THIS: Your name, brand, or studio title -->
    <h1 class="brand">YOUR NAME</h1>

    <footer class="bottom">
      <div class="contact">
        <!-- CHANGE THIS: Your email -->
        <a href="mailto:hello@example.com">hello@example.com</a>
        <!-- CHANGE THIS: Your Instagram username and profile URL -->
        <a href="https://www.instagram.com/yourusername/" target="_blank" rel="noopener noreferrer">Instagram ↗</a>
      </div>
      <!-- Optional label: edit it or delete this whole line -->
      <div class="side-note">Creative practice<br>Los Angeles</div>
    </footer>
  </main>
</body>
</html>
